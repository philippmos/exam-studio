services:
  db:
    image: postgres:16
    container_name: exam-studio-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - exam_studio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: exam-studio-azurite
    restart: unless-stopped
    # Blob service only; bind to all interfaces so the api container can reach
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --location /data
    ports:
      - "10000:10000"
    volumes:
      - exam_studio_azurite:/data

  api:
    build:
      context: ./api
    container_name: exam-studio-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      # Question-image storage: the api talks to Azurite over the compose network
      # (azurite:10000); signed URLs are rewritten to MEDIA_PUBLIC_BASE_URL so the
      # browser can reach them on the published host port (localhost:10000).
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-question-media}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ./client
    container_name: exam-studio-client
    restart: unless-stopped
    env_file: .env
    environment:
      GRAPHQL_URL: ${GRAPHQL_URL:-/graphql}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  exam_studio_pgdata:
  exam_studio_azurite:
