server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers. nginx's add_header does NOT inherit into
    # locations that declare their own add_header, so every such location
    # below repeats this trio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text assets on the fly.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # Reverse-proxy the GraphQL API so the browser talks to a single origin
    # (no CORS). "api" is the compose service name on the shared network.
    location /graphql {
        proxy_pass http://api:8000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    # ZIP import uploads (multipart/form-data) — proxied to the API. The default
    # 1 MB body cap is far too small for image bundles, and streaming the upload
    # straight through keeps nginx from buffering the whole archive to disk.
    location /import {
        proxy_pass http://api:8000/import;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        proxy_request_buffering off;
    }

    # Signed question-image URLs (see MEDIA_PUBLIC_BASE_URL in the API): a
    # read-only proxy to the blob store, so the store itself never has to be
    # exposed — the browser fetches images from this same origin and anything
    # but GET/HEAD is rejected. The variable + resolver defer DNS resolution to
    # request time, so nginx also starts when the store is not deployed.
    location /media/ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $media_upstream http://azurite:10000;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass $media_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime config is generated per environment at container start — never
    # cache it, so a redeploy with new values takes effect immediately.
    location = /config.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Long-cache fingerprinted build assets (Angular adds content hashes).
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback: every other route is handled by Angular's router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
